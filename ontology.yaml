ontology: изомерные-отношения-в-фотоядерных-реакциях

goal: >
  Прослеживать путь от источников данных об изомерных отношениях
  до обработки, результатов и проверок; учитывать ограничения
  сопоставления и состояние задач исследования.

competency_questions:
  - Какие задачи проекта поставлены, в каком они состоянии и какими результатами закрыты?
  - Из какого источника получены данные об изомерном отношении и где сохранены исходные данные?
  - К какой реакции и условиям измерения относятся данные, как определено изомерное отношение и относится ли оно к выходам или сечениям?
  - Какие преобразования выполнены при унификации данных, какие ограничения сопоставления выявлены и к каким данным они относятся?
  - На каких данных и каким методом получен результат анализа, чем он проверен и где сохранён?

classes:
  Задача:
    parent: null
    definition: поручение пользователя или подзадача с проверяемым условием готовности

  Источник:
    parent: null
    definition: публикация или запись базы, из которой получены сведения

  НаборДанных:
    parent: null
    definition: определённая совокупность исходных или обработанных исследовательских данных

  Обработка:
    parent: null
    definition: конкретное выполнение извлечения, преобразования или анализа данных и сведений из источников

  Результат:
    parent: null
    definition: полученный итог работы — таблица, оценка, вывод или отчёт

  Проверка:
    parent: null
    definition: проведённая процедура проверки результата с описанием способа и зафиксированным итогом

  Ограничение:
    parent: null
    definition: установленное обстоятельство, ограничивающее обработку, сопоставление или интерпретацию данных и результатов

  Файл:
    parent: null
    definition: существующий файл проекта; узел графа — сам файл, отдельная заметка о нём не нужна

# domain задаёт класс начала стрелки, range — класс её конца
properties:
  подзадачаОт:
    domain: Задача
    range: Задача
    characteristics: [транзитивное]

  решает:
    domain: [Обработка, Проверка]
    range: Задача

  закрывает:
    domain: Результат
    range: Задача

  полученИз:
    domain: НаборДанных
    range: Источник

  использует:
    domain: Обработка
    range: НаборДанных

  опираетсяНа:
    domain: [Обработка, Проверка, Результат]
    range: Источник

  даёт:
    domain: [Обработка, Проверка]
    range: Результат

  проверенЧерез:
    domain: Результат
    range: Проверка

  ограничивает:
    domain: Ограничение
    range: [НаборДанных, Результат]

  формирует:
    domain: Обработка
    range: НаборДанных

  хранитсяВ:
    domain: [Источник, НаборДанных, Результат]
    range: Файл

  реализованаВ:
    domain: [Обработка, Проверка]
    range: Файл

# Атрибуты — свойства со значением из списка (в заметке — поле в начале файла).
attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]

# Реакцию, условия измерения, определение IR, метод обработки и итог проверки описываем в соответствующих заметках.
# Их научную корректность структурные правила ниже не проверяют.
rules:
  - id: П1
    text: Каждый набор данных связан хотя бы с одним первичным источником.
    dl: "НаборДанных ⊑ ∃полученИз.Источник"
    check:
      kind: some
      class: НаборДанных
      property: полученИз
      target: Источник

  - id: П2
    text: Каждый набор данных связан с файлом, в котором он сохранён.
    dl: "НаборДанных ⊑ ∃хранитсяВ.Файл"
    check:
      kind: some
      class: НаборДанных
      property: хранитсяВ
      target: Файл

  # ⊤ означает «любой объект»
  # Знак ⁻ означает обратное направление связи
  - id: П3
    text: Каждый результат получен при обработке или проверке.
    dl: "Результат ⊑ ∃даёт⁻.(Обработка ⊔ Проверка)"
    check:
      kind: some_inverse
      class: Результат
      property: даёт
      source: "⊤"

  - id: П4
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check:
      kind: defined_value
      name: ВыполненнаяЗадача
      class: Задача
      attribute: status
      values: [выполнена, принята]

  - id: П5
    text: Выполненная задача связана с решающей её обработкой или проверкой, закрывающим результатом либо подзадачами.
    dl: "ВыполненнаяЗадача ⊑ (∃решает⁻.⊤ ⊔ ∃закрывает⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤)"
    check:
      kind: some_inverse_any
      class: ВыполненнаяЗадача
      properties: [решает, закрывает, подзадачаОт]

  - id: П6
    text: Все подзадачи выполненной задачи имеют статус «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check:
      kind: all_inverse
      class: ВыполненнаяЗадача
      property: подзадачаОт
      source: ВыполненнаяЗадача

  - id: П7
    text: У выполненной задачи есть непустой раздел «Итог».
    dl: "— (правило оформления заметки)"
    check:
      kind: section
      class: ВыполненнаяЗадача
      section: Итог
